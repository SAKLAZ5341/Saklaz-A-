name: saklaz_workspace
description: SAKLAZ AI monorepo (Dart pub workspace koku)
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - apps/saklaz_app
  - packages/saklaz_core
  - packages/saklaz_ai_core
  - packages/saklaz_memory
  - packages/saklaz_voice
  - packages/saklaz_android_bridge
  - packages/saklaz_integrations

# Kişisel hafıza şifrelemesi: package:sqlite3 hook'u SQLite3MultipleCiphers
# (MIT lisanslı, ChaCha20-Poly1305) derlemesini paketler. Bkz. SECURITY.md §3.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
